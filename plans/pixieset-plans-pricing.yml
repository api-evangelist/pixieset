specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Pixieset
providerId: pixieset
created: '2026-07-04'
modified: '2026-07-04'
reconciled: false
tags:
- Photography
- Client Galleries
- Studio Management
- Plans
description: >-
  Pixieset does not sell API access - there is no developer/API tier at any
  price point, because there is no public API product. The plans below are
  Pixieset's ordinary consumer/prosumer product subscriptions (Client Gallery,
  and the Suite bundle that adds Studio Manager, Website, Store, and the
  Mobile Gallery App). They are included here only as the real, public pricing
  context for the platform this entry documents - they gate app features and
  storage, not API calls. Monthly USD prices are collected from Pixieset's
  public pricing pages and third-party pricing trackers as of July 2026;
  third-party sources disagree on exact Pro-tier figures (seen as low as ~$24
  on annual billing and as high as $50 on monthly billing), so treat all
  prices as approximate and verify directly on pixieset.com before relying on
  them. Annual billing is discounted versus monthly; a free tier exists with a
  15% Pixieset commission on store sales.
notes: >-
  No plan, at any price, unlocks a documented public API, an API key, OAuth
  credentials, or webhook access - Pixieset has no such program. These tiers
  only affect storage, branding, commission-free sales, video upload minutes,
  and Studio Manager/Website/Store feature limits inside the Pixieset web and
  mobile apps.
sources:
- https://pixieset.com/pricing-studio/
- https://pixieset.com/pricing-suite/
- https://pixieset.com/pricing-studio-manager/
- https://help.pixieset.com/hc/en-us/articles/9975416939277-Choosing-the-right-Subscription
plans:
- id: pixieset-free
  name: Free
  type: free
  description: >-
    Unlimited collections with up to 3 GB of photo storage, client galleries
    with review/share/download, and a functional Store with a 15% Pixieset
    commission on sales. No API access exists at this or any tier.
  entries:
  - label: Storage
    name: storage
    type: flat
    metric: storage
    limit: 3
    timeFrame: month
    geo: global
    unit: GB
    price: free
    userMultiplied: false
  elements:
  - name: Unlimited Collections
  - name: Client Gallery
  - name: Store (15% commission)
- id: pixieset-basic
  name: Basic
  type: paid
  description: >-
    Entry paid tier - adds 10 GB storage, 30 minutes of video upload, custom
    domain connection, removal of Pixieset branding, and commission-free
    sales.
  entries:
  - label: Monthly
    name: monthly
    type: flat
    metric: subscription
    limit: 1
    timeFrame: month
    geo: global
    unit: 1
    currency: USD
    price: '10.00'
    userMultiplied: false
