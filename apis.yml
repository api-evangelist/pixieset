aid: pixieset
url: https://raw.githubusercontent.com/api-evangelist/pixieset/refs/heads/main/apis.yml
name: Pixieset
kind: company
description: Pixieset is an all-in-one photography business platform - client
  galleries, a store for print/digital sales, a website builder, a mobile
  gallery app, and Studio Manager (CRM, booking, invoicing, contracts,
  questionnaires) - used by hundreds of thousands of photographers. Pixieset
  does not publish a public or partner developer API, does not run a
  developer program, and has no self-serve API keys or OAuth signup; there is
  no official API reference, SDK, or webhook system for third parties. The
  product itself is powered internally by two session-cookie-authenticated
  web APIs (a Studio API at studio.pixieset.com/api/v1 for business
  management and a Gallery API at galleries.pixieset.com/api/v1 for gallery
  delivery and e-commerce) that Pixieset's own web app calls, and which an
  independent developer has reverse-engineered and published as unofficial,
  unaffiliated documentation (111+ endpoints). This entry documents that real
  access model honestly - no public API exists, and the endpoint shapes below
  are modeled from that third-party reverse-engineering effort, not from any
  Pixieset-published reference - treat them as unverified and subject to
  change or removal without notice.
