    type: Documentation
  - url: https://trozz.github.io/pixieset-api-docs/docs/studio-api/clients
    type: APIReference
  - url: openapi/pixieset-openapi.yml
    type: OpenAPI
  description: Internal client relationship management surface of Pixieset's
    own Studio web app - list, search, retrieve, and update clients and leads
    (id prefix cl_), their address info, notes, associated galleries, and
    documents. Not a Pixieset-published API; endpoint shapes are modeled from
    unofficial third-party reverse-engineering documentation and are
    unverified against Pixieset's current implementation.
- aid: pixieset:pixieset-studio-sessions-booking-api
  name: Pixieset Studio Sessions & Booking API
