  description: Internal session-type and booking surface used by the Studio
    web app - define bookable session types (id prefix set_) with duration,
    location, pricing, and payment methods, check day/month availability,
    manage schedules and interval overrides, and list booked sessions and
    pending inquiries. Not a Pixieset-published API; modeled from unofficial
    reverse-engineering documentation, unverified against Pixieset's current
    implementation.
- aid: pixieset:pixieset-studio-invoices-payments-api
  name: Pixieset Studio Invoices & Payments API
  tags:
  - Invoices
  - Payments
